<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PC Mirror</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; font: 28px sans-serif; overflow: hidden; }
  #screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  #hud { position: absolute; left: 20px; bottom: 20px; background: rgba(0,0,0,.7); padding: 12px 18px; border-radius: 8px; }
</style>
</head>
<body>
<img id="screen" alt="">
<div id="hud">Connecting...</div>
<script>
(function () {
  // Defaults. Change the PC address with the colour buttons (see below).
  var cfg = { host: "192.168.1.17", port: 8765 };
  try { var s = JSON.parse(localStorage.getItem("pcmirror") || "null"); if (s) { cfg = s; } } catch (e) {}

  var img = document.getElementById("screen");
  var hud = document.getElementById("hud");
  var timer;

  function url() { return "http://" + cfg.host + ":" + cfg.port + "/stream?t=" + Date.now(); }
  function say(t) { hud.textContent = t; hud.style.display = "block"; clearTimeout(timer); timer = setTimeout(function () { hud.style.display = "none"; }, 4000); }

  function connect() {
    say("Connecting to " + cfg.host + ":" + cfg.port + " ...");
    img.src = url();
  }
  img.onload = function () { say("Connected"); };
  img.onerror = function () { say("Cannot reach " + cfg.host + ":" + cfg.port + " - press GREEN to retry, YELLOW to change IP"); };

  // Register colour keys (TizenBrew passes `keys` from package.json, this is a fallback).
  try {
    ["ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue"].forEach(function (k) {
      tizen.tvinputdevice.registerKey(k);
    });
  } catch (e) {}

  document.addEventListener("keydown", function (e) {
    switch (e.keyCode) {
      case 404: // green: reconnect
        connect(); break;
      case 405: // yellow: change PC IP
        var v = window.prompt("PC IP address", cfg.host);
        if (v) {
          cfg.host = v.trim();
          try { localStorage.setItem("pcmirror", JSON.stringify(cfg)); } catch (e2) {}
          connect();
        }
        break;
      case 406: // blue: show info
        say("PC Mirror - " + cfg.host + ":" + cfg.port); break;
    }
  });

  connect();
})();
</script>
</body>
</html>
